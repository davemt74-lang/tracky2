<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c1820"><title>Tracky2 — Play in Motion</title>
<link rel="icon" type="image/svg+xml" href="./assets/tracky-mark.svg">
<link rel="stylesheet" href="./styles.css"><link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="tracky-launch">
<main id="launchScreen" class="launch-screen" aria-label="Tracky2 application launcher">
  <div class="launch-background" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="launch-panel">
    <img src="./assets/tracky-mark.svg" alt="" class="launch-mark" width="112" height="112">
    <p class="launch-overline">SEE · HEAR · CONVERSE</p>
    <h1>TRACKY<span>2</span></h1>
    <p class="launch-tagline">Your local room agent.</p>
    <div id="launchStatus" class="launch-status" role="status" aria-live="polite">Preparing AGENT…</div>
    <div class="launch-progress" aria-hidden="true"><span id="launchProgress"></span></div>
    <div id="launchActions" class="launch-actions">
      <a class="button-link primary launch-primary" id="launchAgent" href="./vertical-motion.html?mode=agent">Enter AGENT →</a>
      <button type="button" id="launchAuto" class="launch-secondary">Stay on splash</button>
    </div>
    <nav class="launch-nav" aria-label="Quick access"><a href="./participants.html">Participants</a>
      <a href="./tracker.html">Tracker setup</a><a href="./diagnostics.html">Hardware self-test</a></nav>
  </div>
  <footer class="launch-footer">Local-first AGENT · Camera and microphone permissions are requested only when you choose to enable them.</footer>
</main>
<script type="module" src="./launch.js"></script>
<script type="module" src="./pwa.js"></script>
</body></html>
