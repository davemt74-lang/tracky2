          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/governed-skill-core.js').then(m=>{if(!m.skillExecutionPolicy||!m.executionProvenance||!m.localSkillTarget)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/agent-cognitive-core.js').then(m=>{if(!m.AgentCognitiveLoop||!m.inQuietHours)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/face-gallery.js').then(m => { if (m.MIN_FACE_SAMPLES !== 3 || m.MAX_FACE_SAMPLES !== 9 || m.FACE_CAPTURE_POSES?.length !== 9 || !m.nextFaceCapturePose) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/face-preview.js').then(m => { if (!m.facePreviewRect || !m.smoothPreviewRect) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/games/random-follow-pattern.js').then(m => { if (!m.randomFollowPatternGame || m.FOLLOW_ZONE_COUNT !== 4) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/shared-board.js').then(m => { if (m.sharedBoardView().zones.length !== 4) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/game-lobby.js').then(m => { if (!m.validateLobbySelection || !m.roundRosterPreview) process.exit(1); })"
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/tracker.html'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/assets/tracky-mark.svg'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/assets/icon-512.png'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/sw.js'
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/games/reaction-challenge.js').then(m => { if (!m.reactionChallengeGame || m.reactionChallengeGame.id !== 'reaction-challenge') process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/roster-layout.js').then(m => { if (m.rosterView({wide:false,mobileOpen:true}).state !== 'mobile-open') process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/camera-preference.js').then(m => { if (!m.cameraAutostartEligible({optIn:true,permission:'granted'}) || m.cameraAutostartEligible({optIn:true,permission:'prompt'})) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/scene-analysis.js').then(m => { if (!m.cameraFacingPoint || !m.stablePublicTracks) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/player-activity.js').then(m => { if (!m.activityEvent || m.MAX_ACTIVITY_ITEMS !== 36) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/visitor-session.js').then(m=>{if(!m.createVisitorSession || !m.reconcileVisitors || !m.promoteVisitorTurn) process.exit(1);})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/room-tabs-state.js').then(m=>{if(m.nextRoomTab('dialogue','activity')!=='activity') process.exit(1);})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/games/agent.js').then(m=>{if(m.agentGame.createSession().requiresBoard!==false) process.exit(1);})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/agent-provider.js').then(m=>{if(m.validateLocalAgentEndpoint('http://localhost:11434')!=='http://localhost:11434') process.exit(1);})"
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/agent-presence.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/agent-presence.css'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/agent-presentation.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/participant-audio-meter.js'
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/agent-presentation.js').then(m=>{if(m.nextAgentTab('dialogue','agent')!=='agent'||!m.orbPresentation({view:'orb',speaking:true}).orbSpeaking)process.exit(1);})"
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/conversation-timeline.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/room-event-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/orb-spatial-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/agent-shortcuts.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/docs/V09-AGENT-ROADMAP.md'
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.15.1/src/agent-presentation.js').then(m=>{if(m.nextAgentTab('agent','ArrowRight')!=='meeting'||m.nextAgentTab('meeting','ArrowRight')!=='room')process.exit(1)})"
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/server/install.php'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/server/admin.php'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/server/session.php'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/server/sync.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/docs/SELFHOST-FOUNDATION.md'
          sha256sum tracky2-v0.15.1-deploy.zip | tee tracky2-v0.15.1-deploy.zip.sha256

      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tracky2-v0.15.1-deploy
          path: |
            tracky2-v0.15.1-deploy.zip
            tracky2-v0.15.1-deploy.zip.sha256
          if-no-files-found: error
          retention-days: 30

      # Actions artifacts are automatically wrapped in another ZIP on download.
      # Publish the deploy ZIP itself as a release asset for a direct, single-ZIP download.
      - name: Publish direct deployment download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TITLE="Tracky2 v0.15.1 — Installed Runtime Hardening"
          RELEASE_NOTES="V0.15.1A adds installed-runtime long-session stability hardening with bounded four-hour evidence, 10-second performance sampling, restart-persistent aggregate certification state, resource-growth budgets, and deploy verification. Certification evidence remains aggregate-only and does not retain raw media or transcripts."
          # Preserve immutable release assets on later main merges, but keep release metadata accurate.
          if gh release view v0.15.1 >/dev/null 2>&1; then
            gh release edit v0.15.1 --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
          else
            gh release create v0.15.1 \
              tracky2-v0.15.1-deploy.zip \
              tracky2-v0.15.1-deploy.zip.sha256 \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi
          gh release view v0.15.1 --json assets \
            --jq '.assets[].name' | grep -Fx 'tracky2-v0.15.1-deploy.zip'
          gh release view v0.15.1 --json assets \
            --jq '.assets[].name' | grep -Fx 'tracky2-v0.15.1-deploy.zip.sha256'

  php-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and dependencies
        run: |
          set -euo pipefail
          php -m | grep -i '^pdo_sqlite$'
          php -m | grep -i '^sodium$'
          for file in server/*.php; do php -l "$file"; done
      - name: Security and first-user installer acceptance
        run: |
          set -euo pipefail
          php server/foundation-test.php
          php server/upgrade-test.php
          bash server/installer-smoke.sh
