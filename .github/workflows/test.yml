          unzip -l tracky2-v0.14.1-deploy.zip | grep -F 'tracky2-v0.14.1/src/recording-core.js'
          unzip -l tracky2-v0.14.1-deploy.zip | grep -F 'tracky2-v0.14.1/src/recording-ui.js'
          node --input-type=module -e "import('./src/recording-core.js').then(m=>{if(!m.createRecordingRecord||!m.finishRecordingRecord||!m.recordingTurnIdsForInterval||!m.recordingMetadataExport||!m.recordingIdsForStoragePressure)process.exit(1)})"
          node --input-type=module -e "import('./src/session-recall-core.js').then(m=>{if(!m.buildRecallProjection||!m.searchRecall||!m.explainRecallResult)process.exit(1)})"
          unzip -l tracky2-v0.14.1-deploy.zip | grep -F 'tracky2-v0.14.1/src/agent-proactive-core.js'
          unzip -l tracky2-v0.14.1-deploy.zip | grep -F 'tracky2-v0.14.1/src/agent-proactive-intelligence-core.js'
          node --input-type=module -e "import('./src/agent-proactive-intelligence-core.js').then(m=>{if(!m.ProactiveSessionPlanner||!m.proactiveOpportunityScore||!m.rankProactiveOpportunities||!m.routineProactiveOpportunity||!m.semanticRepeatState)process.exit(1)})"
          node --input-type=module -e "import('./src/agent-proactive-core.js').then(m=>{if(!m.ProactiveAgentGovernor||!m.followupOpportunity||!m.statusOpportunity)process.exit(1)})"
          unzip -l tracky2-v0.14.1-deploy.zip | grep -F 'tracky2-v0.14.1/src/spatial-calibration-core.js'
