      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tracky2-v0.14.1-deploy
          path: |
            tracky2-v0.14.1-deploy.zip
            tracky2-v0.14.1-deploy.zip.sha256
          if-no-files-found: error
          retention-days: 30

      # Actions artifacts are automatically wrapped in another ZIP on download.
      # Publish the deploy ZIP itself as a release asset for a direct, single-ZIP download.
      - name: Publish direct deployment download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Documentation-only merges must not try to recreate an existing immutable release.
          if gh release view v0.14.1 >/dev/null 2>&1; then
            echo 'v0.14.1 already published; leaving its original assets untouched.'
            exit 0
          fi
          gh release create v0.14.1 \
            tracky2-v0.14.1-deploy.zip \
            tracky2-v0.14.1-deploy.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Tracky2 v0.14.1 — Governed Skills & Tool Execution" \
