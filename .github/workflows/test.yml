name: Tracky2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate codebase
        run: npm run validate

      - name: Build deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist tracky2-v0.11.8-deploy.zip
          mkdir -p dist/tracky2-v0.11.8/src/games dist/tracky2-v0.11.8/docs dist/tracky2-v0.11.8/assets
          cp manifest.webmanifest sw.js pwa.js index.html tracker.html launch.js games.html games.js vertical-motion.html participants.html diagnostics.html app.js vertical-motion.js room-tabs-controller.js agent-mode.js agent-presence.js participants.js participants-sidebar.js participants-stage.js participant-voice.js diagnostics.js styles.css participants-stage.css game-stage.css scene-analysis.css room-tabs.css agent-mode.css agent-presence.css README.md package.json dist/tracky2-v0.11.8/
          cp src/launch-core.js src/tracker-core.js src/movement-core.js src/gameplay-core.js src/game-platform.js src/shared-board.js src/game-lobby.js src/camera-preference.js src/game-session.js src/game-input.js src/game-presenter.js src/color-controllers.js src/multiplayer-match.js src/controller-stability.js src/player-presence.js src/match-history.js src/hardware-diagnostics.js src/face-gallery.js src/face-preview.js src/roster-layout.js src/participant-core.js src/participant-store.js src/identity-engine.js src/room-tracking-core.js src/scene-analysis.js src/player-activity.js src/visitor-session.js src/room-tabs-state.js src/agent-conversation.js src/agent-provider.js src/agent-presentation.js src/conversation-timeline.js src/room-event-core.js src/room-scene-graph.js src/room-scene-ui.js src/room-temporal-core.js src/room-acoustic-patterns.js src/transcript-correction.js src/agent-cognitive-core.js src/agent-proactive-core.js src/session-recall-core.js src/session-recall-ui.js src/agent-task-core.js src/agent-task-ui.js src/agent-memory-core.js src/agent-memory-ui.js src/server-sync-core.js src/room-ui-core.js src/runtime-resilience-core.js src/conversation-listening-core.js src/speaker-participant-core.js src/transcript-lifecycle-core.js src/multi-conversation-core.js src/meeting-core.js src/meeting-ui.js src/environmental-audio-core.js src/environmental-audio-engine.js src/spatial-calibration-core.js src/orb-spatial-core.js src/agent-shortcuts.js src/participant-audio-meter.js src/room-audio-audit.js src/voice-core.js src/voice-engine.js src/room-audio-engine.js src/room-audio-worklet.js src/model-config.js dist/tracky2-v0.11.8/src/
          cp src/games/random-follow-pattern.js src/games/pattern-setup.js src/games/reaction-challenge.js src/games/agent.js dist/tracky2-v0.11.8/src/games/
          cp docs/GAME-PLATFORM.md docs/hardware-acceptance.md docs/V010-RELEASE-ACCEPTANCE.md dist/tracky2-v0.11.8/docs/
          cp assets/tracky-mark.svg assets/icon-192.png assets/icon-512.png dist/tracky2-v0.11.8/assets/
          mkdir -p dist/tracky2-v0.11.8/server
          cp server/bootstrap.php server/install.php server/admin.php server/api.php server/providers.php server/session.php server/sync.js server/sync-api.php server/backup.php dist/tracky2-v0.11.8/server/
          cp docs/SELFHOST-FOUNDATION.md docs/V09-AGENT-ROADMAP.md docs/V010-MASTER-PLAN.md docs/V011-MASTER-PLAN.md docs/DEVELOPMENT-STATUS.md dist/tracky2-v0.11.8/docs/
          cd dist
          zip -r ../tracky2-v0.11.8-deploy.zip tracky2-v0.11.8

      - name: Verify deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t tracky2-v0.11.8-deploy.zip
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/session-recall-core.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/session-recall-ui.js'
          node --input-type=module -e "import('./src/session-recall-core.js').then(m=>{if(!m.buildRecallProjection||!m.searchRecall||!m.explainRecallResult)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/agent-proactive-core.js'
          node --input-type=module -e "import('./src/agent-proactive-core.js').then(m=>{if(!m.ProactiveAgentGovernor||!m.followupOpportunity||!m.statusOpportunity)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/spatial-calibration-core.js'
          node --input-type=module -e "import('./src/spatial-calibration-core.js').then(m=>{if(!m.normalizeFloorCalibration||!m.calibratedTrackPosition||!m.listenerRelation)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/environmental-audio-core.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/environmental-audio-engine.js'
          node --input-type=module -e "import('./src/environmental-audio-core.js').then(m=>{if(!m.EnvironmentalAudioQueue||!m.normalizeEnvironmentalPredictions||!m.EnvironmentalClassificationTracker)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/meeting-core.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/meeting-ui.js'
          node --input-type=module -e "import('./src/meeting-core.js').then(m=>{if(!m.createMeetingRecord||!m.meetingTurns||!m.meetingSummary||!m.meetingAgentReplyPolicy)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/multi-conversation-core.js'
          node --input-type=module -e "import('./src/multi-conversation-core.js').then(m=>{if(!m.multiConversationTurnFields||!m.multiParticipantReplyPolicy||!m.groupConversationContext||!m.agentHistoryForScope)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/transcript-lifecycle-core.js'
          node --input-type=module -e "import('./src/transcript-lifecycle-core.js').then(m=>{if(!m.TranscriptLifecycleController||!m.transcriptExport||!m.searchTranscriptTurns||!m.transcriptSessionSummaries)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/speaker-participant-core.js'
          node --input-type=module -e "import('./src/speaker-participant-core.js').then(m=>{if(!m.resolveSpeakerAssociation||!m.SpeakerAssociationTracker||!m.speakerAssociationTurnFields)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/conversation-listening-core.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/docs/V011-MASTER-PLAN.md'
          node --input-type=module -e "import('./src/conversation-listening-core.js').then(m=>{if(!m.ConversationListeningController||!m.replyEligibility||!m.segmentValidity)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/runtime-resilience-core.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/docs/V010-RELEASE-ACCEPTANCE.md'
          node --input-type=module -e "import('./src/runtime-resilience-core.js').then(m=>{if(!m.RuntimeBudget||!m.RecoveryBudget||!m.storagePressure||!m.releaseAcceptanceSummary)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/room-ui-core.js'
          node --input-type=module -e "import('./src/room-ui-core.js').then(m=>{if(!m.roomUiOverview||!m.roomEventMatchesFilter)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/server-sync-core.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/server/sync-api.php'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/server/backup.php'
          node --input-type=module -e "import('./src/server-sync-core.js').then(m=>{if(!m.planParticipantSync||!m.changeForServer)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/agent-memory-core.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/agent-memory-ui.js'
          node --input-type=module -e "import('./src/agent-memory-core.js').then(m=>{if(!m.AgentMemoryLedger||!m.sessionContextReferences)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/agent-task-core.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/agent-task-ui.js'
          node --input-type=module -e "import('./src/agent-task-core.js').then(m=>{if(!m.AgentTaskQueue||!m.executeRegisteredTask)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/agent-cognitive-core.js'
          node --input-type=module -e "import('./src/agent-cognitive-core.js').then(m=>{if(!m.AgentCognitiveLoop||!m.inQuietHours)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/room-acoustic-patterns.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/transcript-correction.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/room-temporal-core.js'
          node --input-type=module -e "import('./src/room-temporal-core.js').then(m=>{if(!m.RoomTemporalLedger)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/room-scene-graph.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/room-scene-ui.js'
          node --input-type=module -e "import('./src/room-scene-graph.js').then(m=>{if(m.ROOM_SCENE_SCHEMA!==2||!m.upsertRoomArea||!m.setRoomCalibration)process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/docs/V010-MASTER-PLAN.md'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/docs/DEVELOPMENT-STATUS.md'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/room-audio-audit.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F "tracky2-v0.11.8/src/model-config.js"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F "tracky2-v0.11.8/src/room-audio-worklet.js"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/games/random-follow-pattern.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/games/reaction-challenge.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/face-gallery.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/participants-sidebar.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/participants-stage.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/participants-stage.css'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/game-stage.css'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/scene-analysis.css'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/room-tabs.css'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/scene-analysis.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/player-activity.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/room-tabs-controller.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/visitor-session.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/room-tabs-state.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/agent-mode.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/agent-mode.css'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/games/agent.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/agent-conversation.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/agent-provider.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/camera-preference.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/roster-layout.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/face-preview.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/games.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/game-lobby.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/docs/GAME-PLATFORM.md'
          rm -rf dist/package-smoke
          mkdir -p dist/package-smoke
          unzip -q tracky2-v0.11.8-deploy.zip -d dist/package-smoke
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/session-recall-core.js').then(m=>{if(!m.buildRecallProjection||!m.searchRecall||!m.explainRecallResult)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/agent-proactive-core.js').then(m=>{if(!m.ProactiveAgentGovernor||!m.followupOpportunity||!m.statusOpportunity)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/spatial-calibration-core.js').then(m=>{if(!m.normalizeFloorCalibration||!m.calibratedTrackPosition||!m.listenerRelation)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/environmental-audio-core.js').then(m=>{if(!m.EnvironmentalAudioQueue||!m.normalizeEnvironmentalPredictions||!m.EnvironmentalClassificationTracker)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/meeting-core.js').then(m=>{if(!m.createMeetingRecord||!m.meetingSummary||!m.meetingAgentReplyPolicy)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/multi-conversation-core.js').then(m=>{if(!m.multiConversationTurnFields||!m.multiParticipantReplyPolicy||!m.groupConversationContext)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/transcript-lifecycle-core.js').then(m=>{if(!m.TranscriptLifecycleController||!m.transcriptExport||!m.searchTranscriptTurns)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/speaker-participant-core.js').then(m=>{if(!m.resolveSpeakerAssociation||!m.SpeakerAssociationTracker)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/conversation-listening-core.js').then(m=>{if(!m.ConversationListeningController||!m.replyEligibility||!m.segmentValidity)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/runtime-resilience-core.js').then(m=>{if(!m.RuntimeBudget||!m.RecoveryBudget||!m.storagePressure)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/room-ui-core.js').then(m=>{if(!m.roomUiOverview||!m.roomEventMatchesFilter)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/server-sync-core.js').then(m=>{if(!m.planParticipantSync||!m.changeForServer)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/agent-memory-core.js').then(m=>{if(!m.AgentMemoryLedger||!m.sessionContextReferences)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/agent-task-core.js').then(m=>{if(!m.AgentTaskQueue||!m.executeRegisteredTask)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/agent-cognitive-core.js').then(m=>{if(!m.AgentCognitiveLoop||!m.inQuietHours)process.exit(1)})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/face-gallery.js').then(m => { if (m.MIN_FACE_SAMPLES !== 3 || m.MAX_FACE_SAMPLES !== 5) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/face-preview.js').then(m => { if (!m.facePreviewRect || !m.smoothPreviewRect) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/games/random-follow-pattern.js').then(m => { if (!m.randomFollowPatternGame || m.FOLLOW_ZONE_COUNT !== 4) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/shared-board.js').then(m => { if (m.sharedBoardView().zones.length !== 4) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/game-lobby.js').then(m => { if (!m.validateLobbySelection || !m.roundRosterPreview) process.exit(1); })"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/tracker.html'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/assets/tracky-mark.svg'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/assets/icon-512.png'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/sw.js'
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/games/reaction-challenge.js').then(m => { if (!m.reactionChallengeGame || m.reactionChallengeGame.id !== 'reaction-challenge') process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/roster-layout.js').then(m => { if (m.rosterView({wide:false,mobileOpen:true}).state !== 'mobile-open') process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/camera-preference.js').then(m => { if (!m.cameraAutostartEligible({optIn:true,permission:'granted'}) || m.cameraAutostartEligible({optIn:true,permission:'prompt'})) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/scene-analysis.js').then(m => { if (!m.cameraFacingPoint || !m.stablePublicTracks) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/player-activity.js').then(m => { if (!m.activityEvent || m.MAX_ACTIVITY_ITEMS !== 36) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/visitor-session.js').then(m=>{if(!m.createVisitorSession || !m.reconcileVisitors || !m.promoteVisitorTurn) process.exit(1);})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/room-tabs-state.js').then(m=>{if(m.nextRoomTab('dialogue','activity')!=='activity') process.exit(1);})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/games/agent.js').then(m=>{if(m.agentGame.createSession().requiresBoard!==false) process.exit(1);})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/agent-provider.js').then(m=>{if(m.validateLocalAgentEndpoint('http://localhost:11434')!=='http://localhost:11434') process.exit(1);})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/agent-presence.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/agent-presence.css'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/agent-presentation.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/participant-audio-meter.js'
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/agent-presentation.js').then(m=>{if(m.nextAgentTab('dialogue','agent')!=='agent'||!m.orbPresentation({view:'orb',speaking:true}).orbSpeaking)process.exit(1);})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/conversation-timeline.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/room-event-core.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/orb-spatial-core.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/src/agent-shortcuts.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/docs/V09-AGENT-ROADMAP.md'
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.11.8/src/agent-presentation.js').then(m=>{if(m.nextAgentTab('agent','ArrowRight')!=='meeting'||m.nextAgentTab('meeting','ArrowRight')!=='room')process.exit(1)})"
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/server/install.php'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/server/admin.php'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/server/session.php'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/server/sync.js'
          unzip -l tracky2-v0.11.8-deploy.zip | grep -F 'tracky2-v0.11.8/docs/SELFHOST-FOUNDATION.md'
          sha256sum tracky2-v0.11.8-deploy.zip | tee tracky2-v0.11.8-deploy.zip.sha256

      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tracky2-v0.11.8-deploy
          path: |
            tracky2-v0.11.8-deploy.zip
            tracky2-v0.11.8-deploy.zip.sha256
          if-no-files-found: error
          retention-days: 30

      # Actions artifacts are automatically wrapped in another ZIP on download.
      # Publish the deploy ZIP itself as a release asset for a direct, single-ZIP download.
      - name: Publish direct deployment download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Documentation-only merges must not try to recreate an existing immutable release.
          if gh release view v0.11.8 >/dev/null 2>&1; then
            echo 'v0.11.8 already published; leaving its original assets untouched.'
            exit 0
          fi
          gh release create v0.11.8 \
            tracky2-v0.11.8-deploy.zip \
            tracky2-v0.11.8-deploy.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Tracky2 v0.11.8 — Session Recall, Search and Explainability" \
            --notes "V0.11 Section 11I: standalone Session Recall, Search and Explainability reads the existing canonical dialogue, effective ROOM events, meeting metadata, task metadata, active owner-authored memory and existing AGENT reply history at search time. It creates no persistent search index. Transcript corrections and ROOM replacements are reflected from current canonical records; retractions, revocations and deletions disappear; meeting/task references expose stale-source state instead of reconstructing missing content. Search supports strict participant scope, current-vs-historical scope, cross-source decision filtering and per-result provenance/reference explanations. No new media path, transcript authority, external network dependency, VP3 Cloud/HomeServer integration or hidden durable memory is introduced."
          gh release view v0.11.8 --json assets \
            --jq '.assets[].name' | grep -Fx 'tracky2-v0.11.8-deploy.zip'
          gh release view v0.11.8 --json assets \
            --jq '.assets[].name' | grep -Fx 'tracky2-v0.11.8-deploy.zip.sha256'

  php-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and dependencies
        run: |
          set -euo pipefail
          php -m | grep -i '^pdo_sqlite$'
          php -m | grep -i '^sodium$'
          for file in server/*.php; do php -l "$file"; done
      - name: Security and first-user installer acceptance
        run: |
          set -euo pipefail
          php server/foundation-test.php
          php server/upgrade-test.php
          bash server/installer-smoke.sh
