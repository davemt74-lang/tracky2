name: Tracky2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate codebase
        run: npm run validate

      - name: Build deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist tracky2-v0.9.2-deploy.zip
          mkdir -p dist/tracky2-v0.9.2/src/games dist/tracky2-v0.9.2/docs dist/tracky2-v0.9.2/assets
          cp manifest.webmanifest sw.js pwa.js index.html tracker.html launch.js games.html games.js vertical-motion.html participants.html diagnostics.html app.js vertical-motion.js room-tabs-controller.js agent-mode.js agent-presence.js participants.js participants-sidebar.js participants-stage.js participant-voice.js diagnostics.js styles.css participants-stage.css game-stage.css scene-analysis.css room-tabs.css agent-mode.css agent-presence.css README.md package.json dist/tracky2-v0.9.2/
          cp src/launch-core.js src/tracker-core.js src/movement-core.js src/gameplay-core.js src/game-platform.js src/shared-board.js src/game-lobby.js src/camera-preference.js src/game-session.js src/game-input.js src/game-presenter.js src/color-controllers.js src/multiplayer-match.js src/controller-stability.js src/player-presence.js src/match-history.js src/hardware-diagnostics.js src/face-gallery.js src/face-preview.js src/roster-layout.js src/participant-core.js src/participant-store.js src/identity-engine.js src/room-tracking-core.js src/scene-analysis.js src/player-activity.js src/visitor-session.js src/room-tabs-state.js src/agent-conversation.js src/agent-provider.js src/agent-presentation.js src/conversation-timeline.js src/room-event-core.js src/orb-spatial-core.js src/agent-shortcuts.js src/participant-audio-meter.js src/room-audio-audit.js src/voice-core.js src/voice-engine.js src/room-audio-engine.js src/room-audio-worklet.js src/model-config.js dist/tracky2-v0.9.2/src/
          cp src/games/random-follow-pattern.js src/games/pattern-setup.js src/games/reaction-challenge.js src/games/agent.js dist/tracky2-v0.9.2/src/games/
          cp docs/GAME-PLATFORM.md docs/hardware-acceptance.md dist/tracky2-v0.9.2/docs/
          cp assets/tracky-mark.svg assets/icon-192.png assets/icon-512.png dist/tracky2-v0.9.2/assets/
          mkdir -p dist/tracky2-v0.9.2/server
          cp server/bootstrap.php server/install.php server/admin.php server/api.php server/providers.php server/session.php server/sync.js dist/tracky2-v0.9.2/server/
          cp docs/SELFHOST-FOUNDATION.md docs/V09-AGENT-ROADMAP.md dist/tracky2-v0.9.2/docs/
          cd dist
          zip -r ../tracky2-v0.9.2-deploy.zip tracky2-v0.9.2

      - name: Verify deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t tracky2-v0.9.2-deploy.zip
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/room-audio-audit.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F "tracky2-v0.9.2/src/model-config.js"
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F "tracky2-v0.9.2/src/room-audio-worklet.js"
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/games/random-follow-pattern.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/games/reaction-challenge.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/face-gallery.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/participants-sidebar.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/participants-stage.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/participants-stage.css'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/game-stage.css'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/scene-analysis.css'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/room-tabs.css'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/scene-analysis.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/player-activity.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/room-tabs-controller.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/visitor-session.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/room-tabs-state.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/agent-mode.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/agent-mode.css'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/games/agent.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/agent-conversation.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/agent-provider.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/camera-preference.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/roster-layout.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/face-preview.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/games.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/game-lobby.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/docs/GAME-PLATFORM.md'
          rm -rf dist/package-smoke
          mkdir -p dist/package-smoke
          unzip -q tracky2-v0.9.2-deploy.zip -d dist/package-smoke
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/face-gallery.js').then(m => { if (m.MIN_FACE_SAMPLES !== 3 || m.MAX_FACE_SAMPLES !== 5) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/face-preview.js').then(m => { if (!m.facePreviewRect || !m.smoothPreviewRect) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/games/random-follow-pattern.js').then(m => { if (!m.randomFollowPatternGame || m.FOLLOW_ZONE_COUNT !== 4) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/shared-board.js').then(m => { if (m.sharedBoardView().zones.length !== 4) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/game-lobby.js').then(m => { if (!m.validateLobbySelection || !m.roundRosterPreview) process.exit(1); })"
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/tracker.html'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/assets/tracky-mark.svg'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/assets/icon-512.png'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/sw.js'
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/games/reaction-challenge.js').then(m => { if (!m.reactionChallengeGame || m.reactionChallengeGame.id !== 'reaction-challenge') process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/roster-layout.js').then(m => { if (m.rosterView({wide:false,mobileOpen:true}).state !== 'mobile-open') process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/camera-preference.js').then(m => { if (!m.cameraAutostartEligible({optIn:true,permission:'granted'}) || m.cameraAutostartEligible({optIn:true,permission:'prompt'})) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/scene-analysis.js').then(m => { if (!m.cameraFacingPoint || !m.stablePublicTracks) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/player-activity.js').then(m => { if (!m.activityEvent || m.MAX_ACTIVITY_ITEMS !== 36) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/visitor-session.js').then(m=>{if(!m.createVisitorSession || !m.reconcileVisitors || !m.promoteVisitorTurn) process.exit(1);})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/room-tabs-state.js').then(m=>{if(m.nextRoomTab('dialogue','activity')!=='activity') process.exit(1);})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/games/agent.js').then(m=>{if(m.agentGame.createSession().requiresBoard!==false) process.exit(1);})"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/agent-provider.js').then(m=>{if(m.validateLocalAgentEndpoint('http://localhost:11434')!=='http://localhost:11434') process.exit(1);})"
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/agent-presence.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/agent-presence.css'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/agent-presentation.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/participant-audio-meter.js'
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/agent-presentation.js').then(m=>{if(m.nextAgentTab('dialogue','agent')!=='agent'||!m.orbPresentation({view:'orb',speaking:true}).orbSpeaking)process.exit(1);})"
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/conversation-timeline.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/room-event-core.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/orb-spatial-core.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/src/agent-shortcuts.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/docs/V09-AGENT-ROADMAP.md'
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.9.2/src/agent-presentation.js').then(m=>{if(m.nextAgentTab('agent','ArrowRight')!=='room')process.exit(1)})"
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/server/install.php'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/server/admin.php'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/server/session.php'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/server/sync.js'
          unzip -l tracky2-v0.9.2-deploy.zip | grep -F 'tracky2-v0.9.2/docs/SELFHOST-FOUNDATION.md'
          sha256sum tracky2-v0.9.2-deploy.zip | tee tracky2-v0.9.2-deploy.zip.sha256

      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tracky2-v0.9.2-deploy
          path: |
            tracky2-v0.9.2-deploy.zip
            tracky2-v0.9.2-deploy.zip.sha256
          if-no-files-found: error
          retention-days: 30

      # Actions artifacts are automatically wrapped in another ZIP on download.
      # Publish the deploy ZIP itself as a release asset for a direct, single-ZIP download.
      - name: Publish direct deployment download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Documentation-only merges must not try to recreate an existing immutable release.
          if gh release view v0.9.2 >/dev/null 2>&1; then
            echo 'v0.9.2 already published; leaving its original assets untouched.'
            exit 0
          fi
          gh release create v0.9.2 \
            tracky2-v0.9.2-deploy.zip \
            tracky2-v0.9.2-deploy.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Tracky2 v0.9.2 — Room UI, unified conversation and floating orb" \
            --notes "Unified chronological AGENT conversation, fourth ROOM timeline and opt-in local metadata persistence, XXX hide/show, mobile slide-out rails, floating follower orb with speech cadence pulses and apparent-proximity reply volume. Includes existing self-hosted PHP foundation. Advanced room-state inference, external recognition and spatial audio remain future sections."
          gh release view v0.9.2 --json assets \
            --jq '.assets[].name' | grep -Fx 'tracky2-v0.9.2-deploy.zip'
          gh release view v0.9.2 --json assets \
            --jq '.assets[].name' | grep -Fx 'tracky2-v0.9.2-deploy.zip.sha256'

  php-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and dependencies
        run: |
          set -euo pipefail
          php -m | grep -i '^pdo_sqlite$'
          php -m | grep -i '^sodium$'
          for file in server/*.php; do php -l "$file"; done
      - name: Security and first-user installer acceptance
        run: |
          set -euo pipefail
          php server/foundation-test.php
          bash server/installer-smoke.sh
