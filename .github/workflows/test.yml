          gh release view v0.14.1 --json assets \
            --jq '.assets[].name' | grep -Fx 'tracky2-v0.14.1-deploy.zip'
          gh release view v0.14.1 --json assets \
            --jq '.assets[].name' | grep -Fx 'tracky2-v0.14.1-deploy.zip.sha256'

  php-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and dependencies
        run: |
          set -euo pipefail
          php -m | grep -i '^pdo_sqlite$'
          php -m | grep -i '^sodium$'
          for file in server/*.php; do php -l "$file"; done
      - name: Security and first-user installer acceptance
        run: |
          set -euo pipefail
          php server/foundation-test.php
          php server/upgrade-test.php
          bash server/installer-smoke.sh
