name: Tracky2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate codebase
        run: npm run validate

      - name: Build deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist tracky2-v0.6.3-deploy.zip
          mkdir -p dist/tracky2-v0.6.3/src/games dist/tracky2-v0.6.3/docs dist/tracky2-v0.6.3/assets
          cp manifest.webmanifest sw.js pwa.js index.html tracker.html launch.js games.html games.js vertical-motion.html participants.html diagnostics.html app.js vertical-motion.js participants.js participant-voice.js diagnostics.js styles.css README.md package.json dist/tracky2-v0.6.3/
          cp src/launch-core.js src/tracker-core.js src/movement-core.js src/gameplay-core.js src/game-platform.js src/shared-board.js src/game-lobby.js src/game-session.js src/game-input.js src/game-presenter.js src/color-controllers.js src/multiplayer-match.js src/controller-stability.js src/player-presence.js src/match-history.js src/hardware-diagnostics.js src/face-gallery.js src/participant-core.js src/participant-store.js src/identity-engine.js src/room-tracking-core.js src/voice-core.js src/voice-engine.js src/room-audio-engine.js src/room-audio-worklet.js src/model-config.js dist/tracky2-v0.6.3/src/
          cp src/games/random-follow-pattern.js src/games/pattern-setup.js src/games/reaction-challenge.js dist/tracky2-v0.6.3/src/games/
          cp docs/GAME-PLATFORM.md docs/hardware-acceptance.md dist/tracky2-v0.6.3/docs/
          cp assets/tracky-mark.svg assets/icon-192.png assets/icon-512.png dist/tracky2-v0.6.3/assets/
          cd dist
          zip -r ../tracky2-v0.6.3-deploy.zip tracky2-v0.6.3

      - name: Verify deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t tracky2-v0.6.3-deploy.zip
          unzip -l tracky2-v0.6.3-deploy.zip | grep -F "tracky2-v0.6.3/src/model-config.js"
          unzip -l tracky2-v0.6.3-deploy.zip | grep -F "tracky2-v0.6.3/src/room-audio-worklet.js"
          unzip -l tracky2-v0.6.3-deploy.zip | grep -F 'tracky2-v0.6.3/src/games/random-follow-pattern.js'
          unzip -l tracky2-v0.6.3-deploy.zip | grep -F 'tracky2-v0.6.3/src/games/reaction-challenge.js'
          unzip -l tracky2-v0.6.3-deploy.zip | grep -F 'tracky2-v0.6.3/src/face-gallery.js'
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.6.3/src/face-gallery.js').then(m => { if (m.MIN_FACE_SAMPLES !== 3 || m.MAX_FACE_SAMPLES !== 5) process.exit(1); })"
          unzip -l tracky2-v0.6.3-deploy.zip | grep -F 'tracky2-v0.6.3/games.js'
          unzip -l tracky2-v0.6.3-deploy.zip | grep -F 'tracky2-v0.6.3/src/game-lobby.js'
          unzip -l tracky2-v0.6.3-deploy.zip | grep -F 'tracky2-v0.6.3/docs/GAME-PLATFORM.md'
          rm -rf dist/package-smoke
          mkdir -p dist/package-smoke
          unzip -q tracky2-v0.6.3-deploy.zip -d dist/package-smoke
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.6.3/src/games/random-follow-pattern.js').then(m => { if (!m.randomFollowPatternGame || m.FOLLOW_ZONE_COUNT !== 4) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.6.3/src/shared-board.js').then(m => { if (m.sharedBoardView().zones.length !== 4) process.exit(1); })"
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.6.3/src/game-lobby.js').then(m => { if (!m.validateLobbySelection || !m.roundRosterPreview) process.exit(1); })"
          unzip -l tracky2-v0.6.3-deploy.zip | grep -F 'tracky2-v0.6.3/tracker.html'
          unzip -l tracky2-v0.6.3-deploy.zip | grep -F 'tracky2-v0.6.3/assets/tracky-mark.svg'
          unzip -l tracky2-v0.6.3-deploy.zip | grep -F 'tracky2-v0.6.3/assets/icon-512.png'
          unzip -l tracky2-v0.6.3-deploy.zip | grep -F 'tracky2-v0.6.3/sw.js'
          node --input-type=module -e "import('./dist/package-smoke/tracky2-v0.6.3/src/games/reaction-challenge.js').then(m => { if (!m.reactionChallengeGame || m.reactionChallengeGame.id !== 'reaction-challenge') process.exit(1); })"
          sha256sum tracky2-v0.6.3-deploy.zip | tee tracky2-v0.6.3-deploy.zip.sha256

      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tracky2-v0.6.3-deploy
          path: |
            tracky2-v0.6.3-deploy.zip
            tracky2-v0.6.3-deploy.zip.sha256
          if-no-files-found: error
          retention-days: 30

      # Actions artifacts are automatically wrapped in another ZIP on download.
      # Publish the deploy ZIP itself as a release asset for a direct, single-ZIP download.
      - name: Publish direct deployment download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.6.3 \
            tracky2-v0.6.3-deploy.zip \
            tracky2-v0.6.3-deploy.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Tracky2 v0.6.3 — Direct deployment" \
            --notes "Direct standalone ZIP with full participant photo gallery, three-sample enrollment fix, safe per-sample retake/remove, splash, PWA and both games."
          gh release view v0.6.3 --json assets \
            --jq '.assets[].name' | grep -Fx 'tracky2-v0.6.3-deploy.zip'
          gh release view v0.6.3 --json assets \
            --jq '.assets[].name' | grep -Fx 'tracky2-v0.6.3-deploy.zip.sha256'
