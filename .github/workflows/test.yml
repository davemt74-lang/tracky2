name: Tracky2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate codebase
        run: npm run validate

      - name: Build deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist tracky2-v0.15.1-deploy.zip
          mkdir -p dist/tracky2-v0.15.1/src/games dist/tracky2-v0.15.1/docs dist/tracky2-v0.15.1/assets
          cp manifest.webmanifest sw.js pwa.js index.html tracker.html launch.js games.html games.js vertical-motion.html participants.html diagnostics.html app.js vertical-motion.js room-tabs-controller.js agent-mode.js agent-presence.js account-participants.js control-center.js participants.js participants-sidebar.js participants-stage.js participant-voice.js diagnostics.js styles.css participants-stage.css game-stage.css scene-analysis.css room-tabs.css agent-mode.css agent-presence.css README.md package.json dist/tracky2-v0.15.1/
          cp src/launch-core.js src/tracker-core.js src/movement-core.js src/gameplay-core.js src/game-platform.js src/shared-board.js src/game-lobby.js src/camera-preference.js src/game-session.js src/game-input.js src/game-presenter.js src/color-controllers.js src/multiplayer-match.js src/controller-stability.js src/player-presence.js src/match-history.js src/hardware-diagnostics.js src/hardware-certification-core.js src/overlap-source-separation-core.js src/participant-continuity-core.js src/participant-transition-core.js src/multi-room-runtime-core.js src/multi-room-runtime.js src/face-gallery.js src/face-preview.js src/roster-layout.js src/participant-core.js src/participant-enrollment-core.js src/account-participant-core.js src/participant-store.js src/identity-engine.js src/room-tracking-core.js src/scene-analysis.js src/player-activity.js src/visitor-session.js src/room-tabs-state.js src/agent-conversation.js src/agent-provider.js src/provider-router-core.js src/governed-skill-core.js src/governed-skill-client.js src/agent-presentation.js src/conversation-timeline.js src/room-event-core.js src/room-scene-graph.js src/room-scene-ui.js src/room-temporal-core.js src/room-acoustic-patterns.js src/transcript-correction.js src/agent-cognitive-core.js src/agent-proactive-core.js src/agent-proactive-intelligence-core.js src/session-recall-core.js src/semantic-recall-core.js src/session-recall-ui.js src/recording-core.js src/recording-ui.js src/agent-task-core.js src/agent-task-ui.js src/agent-workflow-core.js src/agent-workflow-ui.js src/agent-memory-core.js src/agent-memory-learning-core.js src/agent-memory-ui.js src/server-sync-core.js src/resource-sync-core.js src/room-ui-core.js src/runtime-resilience-core.js src/v011-release-core.js src/v012-release-core.js src/v013-release-core.js src/v0148-release-core.js src/multimodal-identity-core.js src/speaker-diarization-core.js src/continuous-fusion-core.js src/multi-person-attribution-core.js src/session-identity-core.js src/room-handoff-core.js src/spatial-audio-source-core.js src/agent-multimodal-context.js src/long-session-core.js src/device-performance-core.js src/conversation-listening-core.js src/speaker-participant-core.js src/transcript-lifecycle-core.js src/multi-conversation-core.js src/meeting-core.js src/meeting-ui.js src/environmental-audio-core.js src/environmental-intelligence-core.js src/speech-origin-core.js src/music-identification-core.js src/music-identification-client.js src/music-fingerprint-client.js src/media-identification-core.js src/media-identification-client.js src/room-media-fusion-core.js src/room-audio-orchestration-core.js src/room-audio-live-validation-core.js src/room-media-continuity-core.js src/room-contextual-cognition-core.js src/room-situational-awareness-core.js src/room-context-planning-core.js src/contextual-followthrough-core.js src/long-session-autonomy-core.js src/unified-cognitive-state-core.js src/attention-priority-core.js src/goal-intent-core.js src/cognitive-orchestrator-core.js src/conversation-proactivity-core.js src/cognitive-outcome-core.js src/agent-brain-core.js src/v015-autonomy-certification-core.js src/v0151-long-session-stability-core.js src/environmental-alert-core.js src/personalized-sound-core.js src/routine-intelligence-core.js src/environmental-audio-engine.js src/spatial-calibration-core.js src/orb-spatial-core.js src/agent-shortcuts.js src/participant-audio-meter.js src/room-audio-audit.js src/voice-core.js src/voice-engine.js src/room-audio-engine.js src/room-audio-worklet.js src/model-config.js dist/tracky2-v0.15.1/src/
          cp src/games/random-follow-pattern.js src/games/pattern-setup.js src/games/reaction-challenge.js src/games/agent.js dist/tracky2-v0.15.1/src/games/
          cp docs/GAME-PLATFORM.md docs/hardware-acceptance.md docs/V010-RELEASE-ACCEPTANCE.md docs/V011-MASTER-PLAN.md docs/V011-RELEASE-ACCEPTANCE.md docs/V012-MASTER-PLAN.md docs/V012-RELEASE-ACCEPTANCE.md docs/V013-MASTER-PLAN.md docs/V013-RELEASE-ACCEPTANCE.md docs/V014-MASTER-PLAN.md docs/V0148-RELEASE-ACCEPTANCE.md dist/tracky2-v0.15.1/docs/
          cp assets/tracky-mark.svg assets/icon-192.png assets/icon-512.png dist/tracky2-v0.15.1/assets/
          mkdir -p dist/tracky2-v0.15.1/server
          cp server/bootstrap.php server/install.php server/admin.php server/api.php server/providers.php server/provider-api.php server/skill-api.php server/music-id-api.php server/music-fingerprint-api.php server/media-id-api.php server/session.php server/account-participants-api.php server/sync.js server/sync-api.php server/resource-sync.js server/resource-sync-api.php server/room-node-api.php server/backup.php dist/tracky2-v0.15.1/server/
          cp docs/SELFHOST-FOUNDATION.md docs/V09-AGENT-ROADMAP.md docs/V010-MASTER-PLAN.md docs/V011-MASTER-PLAN.md docs/DEVELOPMENT-STATUS.md dist/tracky2-v0.15.1/docs/
          cd dist
          zip -r ../tracky2-v0.15.1-deploy.zip tracky2-v0.15.1

      - name: Verify deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t tracky2-v0.15.1-deploy.zip
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/multimodal-identity-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/speaker-diarization-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/continuous-fusion-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/multi-person-attribution-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/session-identity-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/room-handoff-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/spatial-audio-source-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/agent-multimodal-context.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/long-session-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/device-performance-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/v013-release-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/v0148-release-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/docs/V0148-RELEASE-ACCEPTANCE.md'
          node --input-type=module -e "import('./src/v0148-release-core.js').then(m=>{if(m.V0148_RELEASE_VERSION!=='0.14.8'||!m.v0148ReleaseReadiness||!m.v0148PrivacyBoundary)process.exit(1)})"
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/docs/V013-RELEASE-ACCEPTANCE.md'
          node --input-type=module -e "import('./src/v013-release-core.js').then(m=>{if(m.V013_RELEASE_VERSION!=='0.13.9'||!m.v013RuntimeBounds||!m.v013AuthorityBoundary||!m.v013RepresentativeDeviceScope||!m.v013ArtifactIntegrity||!m.v013ReleaseReadiness)process.exit(1)})"
          node --input-type=module -e "import('./src/device-performance-core.js').then(m=>{if(!m.DevicePerformanceGovernor||!m.adaptivePerformancePolicy||!m.performanceCertificationOutcome)process.exit(1)})"
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/v012-release-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/docs/V012-RELEASE-ACCEPTANCE.md'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/hardware-certification-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/overlap-source-separation-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/participant-continuity-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/participant-transition-core.js'
          node --input-type=module -e "import('./src/participant-transition-core.js').then(m=>{if(!m.ParticipantPresenceTransitionTracker||!m.participantTargetEligibility)process.exit(1)})"
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/multi-room-runtime-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/multi-room-runtime.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/server/room-node-api.php'
          node --input-type=module -e "import('./src/multi-room-runtime-core.js').then(m=>{if(!m.MultiRoomNodeRegistry||!m.MultiRoomEventLedger||!m.participantRoomArbitration)process.exit(1)})"
          node --input-type=module -e "import('./src/multi-room-runtime.js').then(m=>{if(!m.MultiRoomRuntimeClient||!m.multiRoomNodeId)process.exit(1)})"
          node --input-type=module -e "import('./src/participant-continuity-core.js').then(m=>{if(!m.ParticipantContinuityTracker||!m.applyOwnerContinuityCorrection||!m.continuityCandidateState)process.exit(1)})"
          node --input-type=module -e "import('./src/overlap-source-separation-core.js').then(m=>{if(!m.separateStereoOverlap||!m.resolveSeparatedSpeakerMatches||!m.overlapSeparationTurnFields)process.exit(1)})"
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/docs/hardware-acceptance.md'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/docs/V013-MASTER-PLAN.md'
          node --input-type=module -e "import('./src/hardware-certification-core.js').then(m=>{if(m.HARDWARE_CERT_VERSION!=='0.13.0'||!m.buildHardwareCertificationReport||!m.hardwareCertificationSummary||!m.canonicalCertificationJson||!m.compareHardwareCertificationReports)process.exit(1)})"
