          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/agent-proactive-core.js'
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/agent-proactive-intelligence-core.js'
          node --input-type=module -e "import('./src/agent-proactive-intelligence-core.js').then(m=>{if(!m.ProactiveSessionPlanner||!m.proactiveOpportunityScore||!m.rankProactiveOpportunities||!m.routineProactiveOpportunity||!m.semanticRepeatState)process.exit(1)})"
