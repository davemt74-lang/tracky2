          node --input-type=module -e "import('./src/long-session-core.js').then(m=>{if(!m.reconcileParticipantSet||!m.reconcileTransientDialogueTurns||!m.longSessionHealth||!m.restartIntegritySnapshot)process.exit(1)})"
          node --input-type=module -e "import('./src/agent-multimodal-context.js').then(m=>{if(!m.buildAgentMultimodalContext||!m.agentMultimodalPromptLines||!m.agentTurnProactivityEligibility)process.exit(1)})"
          node --input-type=module -e "import('./src/spatial-audio-source-core.js').then(m=>{if(!m.aggregateAudioSourceEvidence||!m.visualSpatialSourceEvidence||!m.fuseSpatialAudioSource||!m.spatialAudioSourceTurnFields)process.exit(1)})"
          node --input-type=module -e "import('./src/room-handoff-core.js').then(m=>{if(!m.RoomHandoffTracker||!m.roomHandoffTurnFields||!m.roomHandoffMessage)process.exit(1)})"
          node --input-type=module -e "import('./src/session-identity-core.js').then(m=>{if(!m.createSessionIdentity||!m.buildSessionIdentityTimeline||!m.sessionIdentityExport)process.exit(1)})"
          node --input-type=module -e "import('./src/multi-person-attribution-core.js').then(m=>{if(!m.buildTurnAttribution||!m.applyAttributionCorrection||!m.multiPersonAttributionTurnFields)process.exit(1)})"
          node --input-type=module -e "import('./src/continuous-fusion-core.js').then(m=>{if(!m.recordVisualHistory||!m.visualSnapshotForWindow||!m.ContinuousSpeakerFusionTracker||!m.summarizeContinuousFusion)process.exit(1)})"
          node --input-type=module -e "import('./src/speaker-diarization-core.js').then(m=>{if(!m.createDiarizationWindows||!m.SpeakerDiarizationSession||!m.finalizeDiarization)process.exit(1)})"
          node --input-type=module -e "import('./src/multimodal-identity-core.js').then(m=>{if(!m.deriveMultimodalEvidence||!m.fuseMultimodalIdentity||!m.MultimodalFusionTracker)process.exit(1)})"
          unzip -l tracky2-v0.15.1-deploy.zip | grep -F 'tracky2-v0.15.1/src/session-recall-core.js'
